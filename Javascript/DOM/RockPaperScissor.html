<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #whole{
            margin: 30px;
            width: 600px;
            background-color: rgb(20, 19, 19);
            border: 1px solid white;
            border-radius: 18px;
            padding: 30px;
        }
        .header{
            height: 100px;
            color: white;
            font-family: cursive;
            font-size: 50px;
            text-align: center;
            padding-top: 20px;
            text-shadow: 0 4px 8px red;
        }

        .options{
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 1s ease;
        }

        .options button{
            width: 100px;
            height: 100px;
            margin: 20px;
            font-size: 50px;
            border-radius: 12px;
            box-shadow: 2px 4px 9px blue;
            cursor: pointer;
        }

        .options button:hover{
            transform: translateY(-10px);
            box-shadow: 3px 6px 12px rebeccapurple;
        }

        h1{
            text-align: center;
            font-size: 32px;
            font-family: cursive;
            color: #f2f2f2;
        }
        .board{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board div{
            width: 100px;
            height: 100px;
            font-size: 90px;
            background-color: white;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 50px 20px;
            border-radius: 50%;
            text-align: center;
        }
        .board h1{
            color: white;
        }

        .Dashboard{
            display: flex;
            align-items: center;
            justify-content: center;
            color: whitesmoke;
            gap: 40px;
            font-size: 15px;
            margin-bottom: 50px;
        }

        #output,#reset{
            width: 300px;
            font-size: 25px;
            display: block;
            margin: 10px auto;
            border-radius: 12px;
            padding: 10px;
            text-shadow: 0 2px 2px blue;
            box-shadow: 2px 4px 9px blue;
            transition: 1s ease;
            
        }

        #output:hover{
            box-shadow: 2px 4px 9px green;
            transform: translateY(-10px);
        }

        #reset:hover{
            box-shadow: 2px 4px 9px green;
            transform: translateY(-10px);
        }

    </style>
</head>
<body>
    <div id="whole">
    <div class="header">Rock.Paper.Scissors</div>
    <div class="options">
        <button onclick="outp('rock')" >🪨</button>
        <button onclick="outp('paper')" >📃</button>
        <button onclick="outp('scissor')">✂️</button>
    </div>

    <h1 id="msg"></h1>

    <div class="board">
        <h1>You : </h1>
        <div id="user"> ? </div>
        <div id="computer">?  </div>
        <h1>: Ai.</h1>
    </div>

    <div class="Dashboard">
        <h1>Wins <span id="win">0</span></h1>
        <h1>Loses <span id="lose">0</span></h1>
        <h1>Draws <span id="draw">0</span></h1>
    </div>

    <button id="output" onclick="refresh()">Refresh</button><br>
    <button id="reset" onclick="reset()">Reset</button>
    </div>


    <script>
        const msg=document.getElementById("msg");

        const win=document.getElementById("win");
        const lose=document.getElementById("lose")
        const draw=document.getElementById("draw");

        const chosen=document.getElementById("user");

        const user=document.querySelectorAll(".options button");

        const output=document.getElementById("computer");

        const opt=['rock','paper','scissor']

        let wins=0;
        let loses=0;
        let draws=0;
        let x;
        let err;

        for(let i=0;i<user.length;i++){
            user[i].addEventListener("click",()=>{
                chosen.innerText = user[i].innerText;
                chosen.style.fontSize="50px";
            })
        }
        function outp(userchoice){
            let n=  Math.floor(Math.random()*3);


            if(n==0) x="🪨";
            else if(n==1) x="📃"
            else x="✂️";

            output.innerText= x;
            output.style.fontSize="50px";

            const computer= opt[n];

            // console.log(userchoice);


            if(userchoice==computer){
                err="Match is a draw";
                draws++;
            }
            else if(
                (userchoice=="rock" && computer=="scissor") ||
                (userchoice=="paper" && computer=="rock")||
                (userchoice=="scissor" && computer=="paper")
            ){
                if(userchoice=="rock"){
                    err="rock beat scissors";
                    wins++;
                }
                else if(userchoice=="paper"){
                    err="paper beat rock";
                    wins++;
                }
                else{
                    err="scissor beat paper";
                    wins++;
                }
            }
            else{
                if(userchoice=="rock"){
                    err="rock lost to paper";
                    loses++;
                }
                else if(userchoice=="paper"){
                    err="paper lost to scissors";
                    loses++;
                }
                else{
                    err="scissor lost to rock";
                    loses++;
                }
            }


            msg.innerText=err;
            win.innerText=wins;
            lose.innerText=loses;
            draw.innerText=draws;

        }

        function refresh(){
            err="";
            x="?";
            msg.innerText=err;

            chosen.innerHTML="?";
            chosen.style.fontSize="90px";

            output.innerText= x;
            output.style.fontSize="90px"; 
        }

         function reset(){
            refresh();
            wins=0;
            loses=0;
            draws=0;

            win.innerText=wins;
            lose.innerText=loses;
            draw.innerText=draws;
         }

    </script>
</body>
</html>
